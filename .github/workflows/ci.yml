name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Integration tests start their own Postgres with Testcontainers (Docker is preinstalled on ubuntu-latest)
      - name: Build and test
        env:
          JWT_SECRET: ci-only-secret-not-for-production-use-0123456789
        run: ./mvnw -B clean verify
