# Local dev only — in Dokploy the API is an Application (Dockerfile) and Postgres a managed Database.
services:

  spring-app:
    build: .
    container_name: gymbro-backend
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://pg-service:5432/gymbro
      - APP_CORS_ALLOWED_ORIGINS=${APP_CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    env_file:
      - app.env
    depends_on:
      pg-service:
        condition: service_healthy
    restart: unless-stopped

  pg-service:
    restart: always
    image: postgres:16
    container_name: gymbro_db
    ports:
      - "127.0.0.1:5432:5432" # loopback only: Docker-published ports bypass host firewalls
    env_file:
      - database.env
    volumes:
      - gymbro_gymbro_vol:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d gymbro" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  gymbro_gymbro_vol:

networks:
  default:
    name: gymbro-net
    driver: bridge
