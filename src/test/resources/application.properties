# Test config — shadows the gitignored src/main/resources/application.properties, so tests run
# the same locally and in CI. Datasource and JWT_SECRET come from env (see .github/workflows/ci.yml).
spring.application.name=gymbro
server.servlet.context-path=/api

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

app.cors.allowed-origins=http://localhost:*

# fake external services: nothing is sent, the beans only need values to start
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.properties.mail.smtp.from=test@example.com
management.health.mail.enabled=false
aws.region=eu-west-1
aws.accessKeyId=test
aws.secretKey=test
cloud.aws.s3.bucket=test-bucket
default.profile.image.key=images/default-profile.png
