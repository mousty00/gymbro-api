# Test config — shadows the gitignored src/main/resources/application.properties, so tests run
# the same locally and in CI. The datasource comes from Testcontainers (IntegrationTestBase);
# JWT_SECRET from env in CI, with a test-only fallback for local runs.
spring.application.name=gymbro
server.servlet.context-path=/api

jwt.secret=${JWT_SECRET:test-only-secret-not-for-production-use-0123456789}

spring.jpa.hibernate.ddl-auto=validate
# No open-session-in-view: services are @Transactional(readOnly = true) by default, so DTO
# mapping happens inside the transaction and the DB connection is released before rendering.
spring.jpa.open-in-view=false
# Lazy collections/proxies of a list load in batches (IN queries), not one query per row (N+1)
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

app.cors.allowed-origins=http://localhost:*

# fake external services: nothing is sent, the beans only need values to start
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.properties.mail.smtp.from=test@example.com
management.health.mail.enabled=false
aws.region=eu-west-1
aws.accessKeyId=test
aws.secretKey=test
cloud.aws.s3.bucket=test-bucket
default.profile.image.key=images/default-profile.png
