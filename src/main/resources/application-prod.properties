# Standalone prod config — application.properties is a local-only, gitignored file that
# never ships in the built jar/image, so this file cannot rely on it for a base layer and
# must carry every structural setting the app needs on its own. No secrets here — everything
# sensitive comes from environment variables via Spring's relaxed binding
# (e.g. JWT_SECRET -> jwt.secret), see .env.prod.example.

spring.application.name=gymbro
server.servlet.context-path=/api
server.port=${PORT:8080}

# Behind Dokploy's Traefik: RemoteIpValve resolves client IP/scheme from X-Forwarded-*,
# trusting only private/loopback hops (server.tomcat.remoteip.internal-proxies default)
server.forward-headers-strategy=native
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
server.compression.enabled=true
server.compression.mime-types=application/json,application/graphql-response+json,text/plain
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never

# CORS — required in prod, no localhost fallback
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}

# JPA/Hibernate — Flyway is the only path for schema changes in prod
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
# ponytail: OSIV stays on — read services map lazy relations to DTOs outside @Transactional.
# Turn off once reads are @Transactional(readOnly = true).
spring.jpa.open-in-view=true

# flyway
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.time-zone=UTC

# pagination — caps @PageableDefault Pageable size on REST
spring.data.web.pageable.max-page-size=100

# multipart
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# GraphQL — no public IDE, no schema introspection
spring.graphql.graphiql.enabled=false
spring.graphql.schema.introspection.enabled=false

# OpenAPI/Swagger — not exposed in prod
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# actuator — only health/info are reachable, even to authenticated callers
management.endpoints.web.exposure.include=health,info

# mail is a non-critical dependency (OTP/welcome emails) — an SMTP outage shouldn't
# flip the aggregate health to DOWN and trigger orchestrator restarts/LB evictions
management.health.mail.enabled=false

# logging
logging.level.root=INFO
logging.level.org.hibernate.SQL=WARN
